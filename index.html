<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sahne Olusturucu</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell scene-mode">
      <header class="menu-bar" id="menuBar" aria-label="Menu cubugu">
        <div class="menu-bar-brand">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="image"></i></span>
          <h1 id="appTitle">Sahne Olusturucu</h1>
          <p id="appSubtitle" hidden>Tek canvas uzerinde sahne, resim ve rol yazisi duzenleyici</p>
        </div>

        <nav class="menu-bar-nav">
          <div class="menu-item" data-menu="dosya">
            <button type="button" class="menu-trigger">Dosya</button>
            <div class="menu-dropdown">
              <button id="downloadBtn" type="button" class="menu-dropdown-item"><i data-lucide="download"></i><span>Tek PNG indir</span></button>
              <button id="exportSceneProjectBtn" type="button" class="menu-dropdown-item"><i data-lucide="save"></i><span>RSE indir</span></button>
              <label class="menu-dropdown-item file-button">
                <i data-lucide="upload"></i><span>RSE yukle</span>
                <input id="sceneProjectInput" type="file" accept=".rse,application/json" />
              </label>
            </div>
          </div>

          <div class="menu-item" data-menu="duzen">
            <button type="button" class="menu-trigger">Duzen</button>
            <div class="menu-dropdown">
              <button id="undoMenuBtn" type="button" class="menu-dropdown-item"><span>Geri al</span><kbd>Ctrl+Z</kbd></button>
              <button id="redoMenuBtn" type="button" class="menu-dropdown-item"><span>Ileri al</span><kbd>Ctrl+Y</kbd></button>
              <button id="copyMenuBtn" type="button" class="menu-dropdown-item"><span>Kopyala</span><kbd>Ctrl+C</kbd></button>
              <button id="cutMenuBtn" type="button" class="menu-dropdown-item"><span>Kes</span><kbd>Ctrl+X</kbd></button>
              <button id="pasteMenuBtn" type="button" class="menu-dropdown-item"><span>Yapistir</span><kbd>Ctrl+V</kbd></button>
              <button id="selectAllMenuBtn" type="button" class="menu-dropdown-item"><span>Tumunu sec</span><kbd>Ctrl+A</kbd></button>
            </div>
          </div>

          <div class="menu-item" data-menu="sahne">
            <button type="button" class="menu-trigger">Sahne</button>
            <div class="menu-dropdown">
              <button id="blankSceneBtn" type="button" class="menu-dropdown-item"><i data-lucide="scan-plus"></i><span>Bos sahne</span></button>
              <label class="menu-dropdown-item file-button" title="Resim sec veya panodaki gorseli Ctrl+V ile yapistir.">
                <i data-lucide="image-plus"></i><span>Resim ekle</span>
                <input id="sceneImageInput" type="file" accept="image/*" multiple />
              </label>
              <button id="clearScenesBtn" type="button" class="menu-dropdown-item danger-action"><i data-lucide="trash-2"></i><span>Sahneleri sil</span></button>
            </div>
          </div>

          <div class="menu-item" data-menu="ayarlar">
            <button type="button" class="menu-trigger">Ayarlar</button>
            <div class="menu-dropdown menu-dropdown-panel">
              <div class="controls-grid compact-grid">
                <label>
                  <span>Cikti genisligi</span>
                  <input id="sceneOutputWidth" type="number" min="640" max="32767" step="20" value="1200" />
                </label>
                <label>
                  <span>Arka plan yuksekligi</span>
                  <input id="sceneBackgroundHeight" type="number" min="300" max="32767" step="20" value="800" />
                </label>
                <label>
                  <span>Sahne font</span>
                  <input id="sceneFontSize" type="number" min="10" max="42" step="1" value="18" />
                </label>
                <label>
                  <span>Sahne bosluk</span>
                  <input id="scenePadding" type="number" min="4" max="80" step="1" value="18" />
                </label>
                <label>
                  <span>Gecis boyutu</span>
                  <input id="sceneTransitionSize" type="number" min="0" max="600" step="10" value="150" />
                </label>
                <label>
                  <span>Gecis filtresi</span>
                  <select id="sceneTransitionStyle">
                    <option value="soft" selected>Soft fade</option>
                    <option value="cinematic">Sinematik kararma</option>
                    <option value="blur">Blur gecis</option>
                    <option value="none">Keskin</option>
                  </select>
                </label>
                <label class="wide-field">
                  <span>Gecis yonu</span>
                  <select id="sceneTransitionSides">
                    <option value="both" selected>Her iki taraf (Ust & Alt)</option>
                    <option value="top">Sadece Ust (Baslangic)</option>
                    <option value="bottom">Sadece Alt (Bitis)</option>
                  </select>
                </label>
                <div class="wide-field apply-row">
                  <button id="applyGlobalTransitionBtn" type="button">
                    <i data-lucide="layers"></i><span>Secilenleri tum katmanlara uygula</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="menu-item" data-menu="gorunum">
            <button type="button" class="menu-trigger">Gorunum</button>
            <div class="menu-dropdown">
              <button id="toggleLayersMenuBtn" type="button" class="menu-dropdown-item"><span>Katman panelini goster/gizle</span></button>
              <button id="toggleShortcutsMenuBtn" type="button" class="menu-dropdown-item"><span>Kisayollari goster/gizle</span></button>
              <button id="zoomFitMenuBtn" type="button" class="menu-dropdown-item"><span>Sigdir</span><kbd>Ctrl+0</kbd></button>
              <button id="zoomInMenuBtn" type="button" class="menu-dropdown-item"><span>Yakinlastir</span><kbd>Ctrl++</kbd></button>
              <button id="zoomOutMenuBtn" type="button" class="menu-dropdown-item"><span>Uzaklastir</span><kbd>Ctrl+-</kbd></button>
            </div>
          </div>
        </nav>

        <div id="sceneStatus" class="menu-bar-status" aria-live="polite"></div>
      </header>

      <section class="preview-panel" aria-label="SS onizleme">
        <section id="scenePreviewPane" class="mode-pane active">
          <section id="sceneList" class="scene-list" aria-label="Sahneler"></section>
          <div id="sceneLayersPanel" class="scene-layers-panel" aria-label="Sahne katmanlari"></div>
          <aside class="shortcut-hud" aria-label="Sahne kisayollari">
            <div class="shortcut-hud-header">
              <strong>Kisayollar</strong>
              <button id="hideShortcutsBtn" class="shortcut-hide-button" type="button">Kapat</button>
            </div>
            <div><kbd>Ctrl</kbd><kbd>V</kbd><span>Yapistir</span></div>
            <div><kbd>Ctrl</kbd><kbd>C</kbd><span>Kopyala</span></div>
            <div><kbd>Ctrl</kbd><kbd>X</kbd><span>Kes</span></div>
            <div><kbd>Ctrl</kbd><kbd>A</kbd><span>Tumunu sec</span></div>
            <div><kbd>Del</kbd><span>Sil</span></div>
            <div><kbd>Ctrl</kbd><kbd>Z</kbd><span>Geri al</span></div>
            <div><kbd>Ctrl</kbd><kbd>Y</kbd><span>Ileri al</span></div>
            <div><kbd>Ctrl</kbd><kbd>Scroll</kbd><span>Yakinlastir</span></div>
            <div><kbd>Space</kbd><kbd>Surukle</kbd><span>Kaydir</span></div>
            <div><kbd>Kenar</kbd><kbd>Surukle</kbd><span>Canvas</span></div>
            <div><kbd>Alt</kbd><kbd>Surukle</kbd><span>Snap kapat</span></div>
            <div><kbd>Alt</kbd><kbd>Yukari/Asagi</kbd><span>Sira</span></div>
            <div><kbd>Ctrl</kbd><kbd>0</kbd><span>Sigdir</span></div>
          </aside>
        </section>
      </section>
      <button id="showLayersBtn" class="layers-show-button" type="button">Katmanlar</button>
      <button id="showShortcutsBtn" class="shortcut-toggle-button" type="button">Kisayollar</button>
    </main>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
